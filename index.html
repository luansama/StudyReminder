```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>📚 Study Reminder</title>

    <meta name="theme-color" content="#222222">

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>📚 Study Reminder</h1>
            <p>Quản lý bài tập và lịch học</p>

            <button id="notificationButton">
                🔔 Bật thông báo
            </button>
        </header>

        <section class="form-section">

            <h2>➕ Thêm bài tập</h2>

            <form id="taskForm">

                <label>Môn học</label>
                <input
                    type="text"
                    id="subject"
                    placeholder="Ví dụ: Toán"
                    required
                >

                <label>Nội dung</label>
                <textarea
                    id="content"
                    placeholder="Ví dụ: Làm bài tập trang 25"
                    required
                ></textarea>

                <label>Hạn nộp</label>
                <input
                    type="datetime-local"
                    id="deadline"
                    required
                >

                <label>Mức độ</label>

                <select id="priority">

                    <option value="mandatory">
                        🔴 BẮT-BUỘC
                    </option>

                    <option value="important">
                        🟠 QUAN-TRỌNG
                    </option>

                    <option value="normal" selected>
                        🟡 THƯỜNG
                    </option>

                    <option value="reference">
                        🟢 THAM KHẢO
                    </option>

                </select>

                <button type="submit">
                    ➕ Thêm bài
                </button>

            </form>

        </section>

        <section class="task-section">

            <h2>📋 Bài tập</h2>

            <div id="taskList"></div>

        </section>

    </div>

    <div id="notificationPopup" class="notification-popup">
        <span id="popupMessage"></span>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging-compat.js"></script>

    <!-- App -->
    <script src="./script.js"></script>

    <!-- PWA -->
    <script>
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function () {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(function () {
                        console.log("PWA đã được đăng ký.");
                    })
                    .catch(function (error) {
                        console.log("Lỗi PWA:", error);
                    });

            });

        }
    </script>

</body>
</html>
```
